<!-- 
  
  Description:
  HTML page for an Async JavaScript Lab that demonstrates asynchronous operations.
  
  Components:
  - Header (h1): Displays the lab title "Async JavaScript Lab"
  - Button (#fetch-data): Triggers data fetching functionality
  - Container (#data-container): Display area for fetched data
  - Contact Form: Simple contact form with labeled input fields
  - Script: Links to external JavaScript file (Async.js) for async logic implementation
  
  Usage:
  Click the "Fetch Data" button to trigger asynchronous data retrieval.
  Results will be displayed in the data-container div.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Async JavaScript Lab</title>
</head>
<body>
<h1>Async JavaScript Lab</h1>
 <button id="fetch-data">Fetch Data</button>
 <div id="data-container"></div>

 <form id="contact-form">
  <label for="name">Name:</label>
  <input type="text" id="name" name="name" required>
  
  <label for="email">Email:</label>
  <input type="email" id="email" name="email" required>
  
  <button type="submit">Submit</button>
 </form>

 <script src="Async.js"></script>
</body>
</html>
